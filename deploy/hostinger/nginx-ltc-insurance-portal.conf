# LTC Insurance Portal — Nginx reverse proxy
# Replace ltc.example.com with the production domain.
# Install path suggestion:
#   sudo cp deploy/hostinger/nginx-ltc-insurance-portal.conf /etc/nginx/sites-available/ltc-insurance-portal
#   sudo ln -s /etc/nginx/sites-available/ltc-insurance-portal /etc/nginx/sites-enabled/ltc-insurance-portal
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name ltc.example.com www.ltc.example.com;

    # App upload validation allows up to 50 MB. Leave overhead for multipart/base64 transport.
    client_max_body_size 75M;

    access_log /var/log/nginx/ltc-insurance-portal.access.log;
    error_log  /var/log/nginx/ltc-insurance-portal.error.log warn;

    location /uploaded-files/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        expires off;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
